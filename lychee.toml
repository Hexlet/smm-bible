# Внешние ссылки. Внутренние проверяют сборка VitePress и rumdl (MD051, MD057): он же покрывает корневые файлы и docs/research/, которых нет в сборке.
# GITHUB_TOKEN берётся из окружения, чтобы не упираться в лимиты github.com.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
accept = ["200..=204", "429"]
exclude_path = ["node_modules", "docs/.vitepress/dist", "docs/.vitepress/cache"]
# Ссылки на сам репозиторий отвечают 404, пока коммит не запушен.
exclude = ["^https://github.com/mokevnin/smm-bible/"]
# Только внешние ссылки: локальные пути вида /strategy/ — это маршруты VitePress, а не файлы.
root_dir = "docs"
scheme = ["http", "https"]
