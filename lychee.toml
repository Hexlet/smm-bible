# Внешние ссылки. Внутренние проверяют сборка VitePress и rumdl (MD051, MD057): он же покрывает корневые файлы и docs/research/, которых нет в сборке.
# GITHUB_TOKEN берётся из окружения, чтобы не упираться в лимиты github.com.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
accept = ["200..=204", "429"]
exclude_path = ["node_modules", "docs/.vitepress/dist", "docs/.vitepress/cache"]
# Ссылки на сам репозиторий отвечают 404, пока коммит не запушен.
# Сайты ниже стоят за защитой от ботов (Cloudflare отвечает 403 с cf-mitigated: challenge)
# любому автоматическому клиенту, хотя страницы открываются в браузере. Проверять их вручную.
# DOI исключены по префиксу издательства: doi.org редиректит на сайт издательства с той же защитой.
# 10.1093 — Oxford University Press, 10.1126 — Science (AAAS), 10.1145 — ACM,
# 10.1177 — SAGE, 10.1287 — INFORMS, 10.1509 — American Marketing Association (журналы на SAGE).
# consultant.ru отвечает 418 или не отвечает на запросы с IP раннеров GitHub Actions,
# хотя из обычной сети те же страницы открываются с кодом 200.
# PDF на fer.unizg.hr закрыт CMS-авторизацией (401); подборка ai-content-audience-reaction
# прямо пишет, что файл не открылся, а ссылка указывает на источник.
exclude = [
  "^https://github.com/Hexlet/smm-bible/",
  "^https://help\\.x\\.com/",
  "^https://www\\.sagepub\\.com/",
  "^https://journals\\.sagepub\\.com/",
  "^https://doi\\.org/10\\.(1093|1126|1145|1177|1287|1509)/",
  "^https://tgstat\\.ru/",
  "^https://kaz\\.tgstat\\.com/",
  "^https://www\\.consultant\\.ru/",
  "^https://www\\.academia\\.edu/",
  "^https://support\\.bitly\\.com/",
  # Точки не экранированы: так typos распознаёт URL и не считает название домена опечаткой.
  "^https://www.canva.com/",
  "^https://www\\.fer\\.unizg\\.hr/_download/repository/7_Do_You_Create_Your_Content_Yourself",
]
# Только внешние ссылки: локальные пути вида /strategy/ — это маршруты VitePress, а не файлы.
root_dir = "docs"
scheme = ["http", "https"]
